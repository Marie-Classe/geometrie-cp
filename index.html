:root{--bg:#f3f7fb;--panel:#fff;--fg:#1d2733;--muted:#62707f;--line:#d3e0ec;--g:#2a6f97;--g-l:#e1eef7;--ok:#1f8a4c;--ko:#b3261e;--c:#2a6f97;--E:#b8434c;--S:#b7791f;--F:#2a6f97}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111820;--panel:#1a2430;--fg:#e8f0f7;--muted:#a7b6c4;--line:#2d3f50;--g:#74b9e4;--g-l:#223344;--ok:#4cc58a;--ko:#ff9a9a;--c:#74b9e4;--E:#ee8a92;--S:#e3b45e;--F:#74b9e4}}
:root[data-theme=dark]{--bg:#111820;--panel:#1a2430;--fg:#e8f0f7;--muted:#a7b6c4;--line:#2d3f50;--g:#74b9e4;--g-l:#223344;--ok:#4cc58a;--ko:#ff9a9a;--c:#74b9e4;--E:#ee8a92;--S:#e3b45e;--F:#74b9e4;color-scheme:dark}
:root[data-theme=dark] .op.good{background:#1f4a33;color:#d3f0de}:root[data-theme=dark] .op.bad{background:#552422;color:#fbdcda}
.btn:disabled{opacity:.45;cursor:default}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'AccesScript',system-ui,sans-serif;font-size:20px}
button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px}
h1{font-size:24px;margin:0;color:var(--g)}.sub{font-size:16px;color:var(--muted)}
.seg{display:inline-flex;border:2px solid var(--g);border-radius:14px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:8px 16px}.seg button[aria-pressed=true]{background:var(--g);color:#fff}
.btn{border:2px solid var(--g);background:var(--g);color:#fff;border-radius:12px;padding:8px 14px}
.btn.ghost{background:var(--panel);color:var(--g)}.btn.small{padding:4px 10px;font-size:18px}
.app{display:grid;grid-template-columns:320px 1fr;gap:14px;padding:0 16px 24px;align-items:start}
.chs{display:flex;flex-direction:column;gap:5px;max-height:calc(100vh - 90px);overflow:auto;position:sticky;top:8px}
.flt{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px}.flt button{border:2px solid var(--line);background:var(--panel);border-radius:20px;padding:2px 10px;font-size:15px}.flt button[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}
.chs .cb{display:flex;gap:10px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:6px 10px;font-size:17px;line-height:1.1;border-left:8px solid var(--dc)}
.chs .cb .cd{background:var(--dc);color:#fff;border-radius:7px;padding:1px 9px;font-weight:700}
.chs .cb .ok{margin-left:auto;color:var(--ok);font-weight:800}
.chs .cb[aria-current=true]{border-color:var(--dc);background:var(--g-l);font-weight:700}
.board{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px;min-width:0}
.sbar{flex-wrap:wrap;background:var(--g-l);border:2px solid var(--dc);border-radius:12px;padding:6px 14px;font-weight:700;display:flex;gap:10px;align-items:center}
.sbar .code{background:var(--dc);color:#fff;border-radius:8px;padding:0 10px}
.chip{font-size:14px;border-radius:12px;padding:0 8px;background:var(--dc);color:#fff;font-weight:600}
.cons{margin:8px 2px}.cons b{color:var(--g)}
.lvl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.lvl button{border:3px solid var(--g);background:var(--panel);border-radius:10px;min-width:44px;padding:2px 10px}
.lvl button[aria-pressed=true]{background:var(--g);color:#fff}.lvl button.done{box-shadow:inset 0 -5px 0 var(--ok)}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.it .l{font-size:26px;font-weight:700;color:var(--dc)}
.it .q{font-size:26px;line-height:1.3}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.op{border:3px solid var(--g);background:var(--panel);border-radius:12px;padding:6px 14px;font-size:22px}
.op.sel{background:var(--g-l);box-shadow:0 0 0 3px var(--g) inset}.op.good{background:#d3f0de;border-color:var(--ok);color:#0b5a2d}.op.bad{background:#fbdcda;border-color:var(--ko);color:#7a1511}.op.was{border-style:dashed;border-color:var(--ok)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .op.good{background:#1f4a33;color:#d3f0de}:root:not([data-theme=light]) .op.bad{background:#552422;color:#fbdcda}}
.badge{font-size:34px;font-weight:800}.badge.ok{color:var(--ok)}.badge.ko{color:var(--ko)}
.spk{border:0;background:transparent;font-size:24px;padding:0 6px;vertical-align:middle}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}
.note{margin-top:10px;border:2px dashed var(--line);border-radius:12px;padding:6px 12px;font-size:16px;color:var(--muted)}
.lesson{border:4px solid var(--dc);border-radius:18px;padding:16px 22px 20px;background:var(--panel);font-size:1.4em;line-height:1.5;margin:8px 0}
.lesson .lt{font-weight:900;color:var(--dc);font-size:1.1em;margin-bottom:8px}.lesson .lt .code{background:var(--dc);color:#fff;border-radius:8px;padding:0 10px}
.lk{display:block;font-size:.55em;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-bottom:2px}
.lesson .lq{background:color-mix(in srgb,var(--dc) 12%,var(--panel));border-radius:14px;padding:10px 16px;margin-bottom:12px}
.lesson .lxs{border-left:5px solid var(--dc);padding-left:16px;margin-bottom:12px}.lesson .lxi{margin:4px 0}
.lesson .ltip{font-size:.85em;font-weight:700;color:var(--g);margin-bottom:6px}
.lesson .lact{font-size:.8em;background:var(--g-l);border-radius:12px;padding:6px 12px}
.lesson a{color:var(--g);font-weight:700}
.deck{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px}
.card{width:min(520px,92%);min-height:300px;border:4px solid var(--dc);border-radius:24px;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer;perspective:800px;user-select:none}
.card .em{font-size:110px;line-height:1.1}.card .wd{font-size:40px;font-weight:800;color:var(--dc)}.card .df{font-size:28px;margin-top:8px;line-height:1.35}
.card .hint{font-size:16px;color:var(--muted);margin-top:8px}
.cnt{font-size:18px;color:var(--muted)}
.mdl .step{background:var(--g-l);border-radius:12px;padding:6px 12px;font-size:18px;margin-top:6px}
body.focus header,body.focus .chs,body.focus .sbar,body.focus .lvl,body.focus .note{display:none}body.focus .app{grid-template-columns:1fr}
@media(max-width:860px){.app{grid-template-columns:1fr}.chs{position:static;max-height:none;flex-direction:row;flex-wrap:nowrap;overflow-x:auto}.chs .cb{flex:none}.flt{display:none}.it{grid-template-columns:1fr}.op{font-size:20px}}
.ic{display:block}.vis{margin:8px 0;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px;display:inline-block;max-width:100%;overflow-x:auto}
.big{line-height:1}.row{display:flex;gap:10px}.code{font-size:1.15em;letter-spacing:3px;background:var(--g-l);border-radius:8px;padding:0 8px}
.eg{display:inline-grid;gap:4px;background:#fff;color:#222}.ec,.el{display:flex;align-items:center;justify-content:center;width:58px;height:58px;font-size:34px;border:2px solid #9ab;border-radius:6px}.ec b{font-size:30px;color:#b8434c}.el{border:0;font-size:24px;font-weight:800;width:auto;color:#2a6f97}
.opts .op svg{display:block}.opts .op{display:flex;align-items:center;gap:6px}
.col{display:flex;flex-direction:column;align-items:center;gap:2px}.big2{font-size:34px;display:inline-block;margin:4px 0}.opts .op span{font-size:20px}.tow{display:flex;flex-direction:column;align-items:center}.tow .ic{margin:-6px 0}
.drawbox{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px}.mod{background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px}.mod .lk{color:#62707f}
.it .side{display:flex;flex-direction:column;gap:6px;align-items:center}
</style></head><body>

EXTRA['7']={4:(r)=>{const m=pick(T7.l2,r),[w,h]=ext(m);return cp7(m,w,h,m.slice(0,2))},
5:(r)=>{const m=pick(T7.l3,r),[w,h]=ext(m);return cp7(m,w,h,m.slice(0,3))},
6:(r)=>{const m0=pick(T7.l3,r),[w,h]=ext(m0),m=m0.map(s=>[w-s[0],s[1],w-s[2],s[3]]);return cp7(m,w,h)}};
/* ---- 8 ---- */
EXTRA['8']={4:(r)=>{const W=6,H=5,x0=ri(0,W-2,r),y0=ri(0,H-1,r),m=[[x0,y0,x0+2,y0],[x0+2,y0,x0+2,y0+1],[x0+2,y0+1,x0,y0+1],[x0,y0+1,x0,y0],[x0+1,y0,x0+1,y0+1]];return{draw:{w:W,h:H,model:m,start:[x0,y0]},q:'▭ Trace un <b>rectangle</b> de 2 carreaux sur 1. Coupe-le en <b>2 carrés</b>.'}},
5:(r)=>{const W=6,H=5,x0=ri(0,W-2,r),y0=ri(1,H-2,r),m=[[x0,y0,x0+2,y0],[x0+2,y0,x0+2,y0+2],[x0+2,y0+2,x0,y0+2],[x0,y0+2,x0,y0],[x0,y0,x0+1,y0-1],[x0+1,y0-1,x0+2,y0]];return{draw:{w:W,h:H,model:m,start:[x0,y0]},q:'🏠 Trace un <b>carré</b> de 2 carreaux. Ajoute un <b>toit</b> : un triangle au-dessus.'}}};
/* ---- 9 ---- */
EXTRA['9']={4:(r)=>{const K=[['tri','🔺'],['car','🟦'],['dis','🟡']],c={tri:ri(1,4,r),car:ri(1,4,r),dis:ri(1,3,r)};let l=[];Object.keys(c).forEach(k=>{for(let i=0;i<c[k];i++)l.push(k)});l=shuf(l,r);
  const S1={tri:'<polygon points="5,36 35,36 20,8" fill="#9ad0f5" stroke="#1d3557" stroke-width="2.5"/>',car:'<rect x="6" y="8" width="28" height="28" fill="#9ad0f5" stroke="#1d3557" stroke-width="2.5"/>',dis:'<circle cx="20" cy="22" r="15" fill="#9ad0f5" stroke="#1d3557" stroke-width="2.5"/>'};
  const vis=svg(l.map((k,i)=>`<g transform="translate(${(i%5)*42},${Math.floor(i/5)*44})">${S1[k]}</g>`).join(''),Math.min(5,l.length)*50,Math.ceil(l.length/5)*52,`0 0 ${Math.min(5,l.length)*42} ${Math.ceil(l.length/5)*44}`);
  const k=pick(K,r),n=c[k[0]];return mk(vis,`Combien de ${k[1]} ?`,n,noDup([n+1,n-1,n+2],2),r)},
5:(r)=>{const V=[['2 triangles peuvent faire un <b>carré</b> 🔺🔺',1],['2 carrés peuvent faire un <b>rectangle</b> 🟦🟦',1],['Un carré coupé en diagonale fait <b>2 triangles</b> ✂️',1],['2 disques font un <b>carré</b> 🟡🟡',0],['Un rectangle coupé en 2 peut faire <b>2 carrés</b> ✂️',1],['Un triangle coupé en 2 fait <b>2 disques</b> ✂️',0]];const v=pick(V,r);return VFq(v[0],v[1])}};
let cur='1',lv=-1,sr=0,mode='eleve',view='ex',flt='*',shown=false,S={},done={},card=0,flip=false,deckOrder=null;
function items(c,l,s){const d=D[c];return[0,1,2].map(i=>{const r=rngf(c+'|'+l+'|'+s+'|'+i);return l>3?EXTRA[c][l](r):d.gen(l,r)})}
const LV=c=>Array.from({length:NL[c]},(_,i)=>i+1);
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/<[^>]*>/g,'').replace(/[\u{1F000}-\u{1FFFF}☀-➿️]/gu,''));u.lang='fr-FR';u.rate=.85;speechSynthesis.speak(u)}catch(e){}};
const plain=h=>h.replace(/<[^>]*>/g,'');
function chBtns(){const l=ORDER.filter(c=>flt=='*'||D[c].dom==flt);
 $('#chs').innerHTML=`<div class="flt"><button data-f="*" aria-pressed="${flt=='*'}">Tous</button>${Object.keys(DOM).map(k=>`<button data-f="${k}" aria-pressed="${flt==k}" style="${flt==k?'':'border-color:var(--'+k+')'}">${DOM[k][0]}</button>`).join('')}</div>`+l.map(c=>`<button class="cb" style="--dc:var(--${D[c].dom})" data-c="${c}" aria-current="${c==cur}"><span class="cd">${D[c].ic}</span><span>GEOM ${c} · ${D[c].t}</span>${LV(c).every(e=>done[c+'|'+e])?'<span class="ok">✓</span>':''}</button>`).join('')}
function lessonHTML(c){const d=D[c],z=d.les;return`<div class="lesson" style="--dc:var(--${d.dom})"><div class="lt"><span class="code">GEOM ${c}</span> Leçon <button class="spk" data-say="${(plain(d.sv)+' '+plain(z.r)).replace(/"/g,'')}" title="Écouter">🔊</button></div><div class="lq"><span class="lk">Je retiens</span><b>${d.sv}</b><br>${z.r}</div><div class="lq" style="background:var(--g-l)"><span class="lk">Je sais faire</span>${d.sf}</div><div class="lxs"><span class="lk">Exemples</span>${z.ex.map(x=>`<div class="lxi">${x}</div>`).join('')}</div><div class="ltip">💡 ${z.tip}</div><div class="lact">🧑‍🏫 <b>En classe :</b> ${z.act}</div></div>`}
const segKey=s=>s.join();
function drawHTML(it,i,key,el,show){const st=S[key+i]||{segs:(it.draw.given||[]).map(s=>[...s])},d=it.draw,ok=st.done;
 const ov=show||(st.done&&!st.ok)?{under:d.model,ucol:'#2e9d5a',uw:11,dash:0}:{};
 let h=(d.showModel?`<div class="mod"><span class="lk">Modèle</span>${gridSVG(d,d.model,{col:'#1d3557'})}</div>`:'')+`<div class="mod"><span class="lk">${d.showModel?'À toi':'Ton tracé'}</span>${gridSVG(d,st.segs||[],{click:!st.done,sel:st.sel,...ov})}</div>`;
 return`<div class="drawbox">${h}</div>`}
function itemHTML(it,i,key,el,show){const st=S[key+i]||{};const L='abc'[i];
 const side=el?(st.done?`<div class="badge ${st.ok?'ok':'ko'}">${st.ok?'✓':'✗'}</div>`:`<button class="btn small" data-val="${i}" ${it.draw?(st.segs&&st.segs.length>(it.draw.given||[]).length?'':'disabled'):(st.pick!==undefined?'':'disabled')}>Valider</button>${it.draw?`<button class="btn ghost small" data-undo="${i}" ${st.segs&&st.segs.length?'':'disabled'}>↩</button>`:''}`):'';
 let body;
 if(it.draw)body=drawHTML(it,i,key,el,show);
 else body=`<div class="opts">`+it.opts.map((o,k)=>{let c='op';if(el){if(st.done){if(st.pick===k)c+=k===it.ans?' good':' bad';else if(k===it.ans)c+=' was'}else if(st.pick===k)c+=' sel'}else if(show&&k===it.ans)c+=' good';return`<button class="${c}" data-op="${k}" data-i="${i}">${o}</button>`}).join('')+`</div>`;
 return`<div class="it"><span class="l">${L})</span><div><div class="q">${it.q} <button class="spk" data-say="${plain(it.q).replace(/"/g,'')}" title="Écouter">🔊</button></div>${it.vis?`<div class="vis">${it.vis}</div>`:''}${body}</div><div class="side">${side}</div></div>`}
function render(){$('#vEx').setAttribute('aria-pressed',view=='ex');$('#vCa').setAttribute('aria-pressed',view=='ca');chBtns();
 const d=D[cur],dc=`--dc:var(--${d.dom})`;
 const head=`<div class="sbar" style="${dc}"><span class="code">GEOM ${cur}</span><span>${d.ic} ${d.t}</span><span class="chip">${DOM[d.dom][0]}</span><span style="margin-left:auto" class="seg"><button data-m="tab" aria-pressed="${mode=='tab'}">Au tableau</button><button data-m="eleve" aria-pressed="${mode=='eleve'}">Élève</button><button data-fs="1" title="Plein écran">⛶</button></span></div>`;
 if(view=='ca'){const deck=deckOrder&&deckOrder.c==cur?deckOrder.o:[...d.cards.keys()];const x=d.cards[deck[card%deck.length]];
  $('#main').innerHTML=head+`<div class="deck" style="${dc}"><div class="cnt">Carte ${card%deck.length+1} / ${deck.length}</div><div class="card" data-flip="1">${flip?`<div class="wd">${x[1]}</div><div class="df">${x[2]}</div>`:`<div class="em">${x[0]}</div><div class="hint">Touche la carte pour la retourner</div>`}</div><div class="bar" style="justify-content:center"><button class="btn ghost" data-card="-1">←</button><button class="btn ghost" data-say="${x[1]}. ${x[2]}">🔊</button><button class="btn ghost" data-shuf="1">🔀 Mélanger</button><button class="btn" data-card="1">Suivante →</button></div></div>`;return}
 const el=mode=='eleve'&&lv>0,key=cur+'|'+lv+'|'+sr+'|';
 const lvb=`<button aria-pressed="${lv==-1}" data-e="-1">📖 Leçon</button><span>Exercice</span>`+[0,...LV(cur)].map(e=>`<button aria-pressed="${e==lv}" class="${done[cur+'|'+e]?'done':''}" data-e="${e}">${e}</button>`).join('');
 let body,bar='';
 if(lv==-1)body=lessonHTML(cur);
 else if(lv==0){body=`<div class="mdl"><p class="cons"><b>Modèle :</b> on le fait ensemble. Je regarde, je réfléchis, je réponds.</p>`+LV(cur).map(l=>{const it=items(cur,l,0)[0];return`<p class="cons"><b>${l}.</b> ${d.cons[l-1]}</p>`+itemHTML(it,0,'m|'+l+'|',false,true)}).join('')+`</div>`}
 else{const its=items(cur,lv,sr);let n=0,nd=0;its.forEach((_,i)=>{const st=S[key+i];if(st&&st.done){nd++;if(st.ok)n++}});if(el&&nd==3)done[cur+'|'+lv]=1;
  body=`<p class="cons"><b>${d.cons[lv-1]}</b></p>`+its.map((it,i)=>itemHTML(it,i,key,el,shown)).join('');
  bar=`<div class="bar">${el?'':`<button class="btn" id="bShow">${shown?'Cacher':'Montrer'} la correction</button>`}<span>Série ${[0,1,2].map(k=>`<button class="btn ghost small" data-s="${k}" style="${k==sr?'background:var(--g);color:#fff':''}">${k+1}</button>`).join(' ')}</span>${el?`<span class="score">Juste : <b>${n}</b> / 3${nd==3?(n==3?' · Bravo !':' · Courage !'):''}</span>`:''}<button class="btn ghost" id="bPrev">←</button><button class="btn ghost" id="bNext">Suivant →</button></div>`}
 if(lv<=0)bar=`<div class="bar"><span></span><button class="btn ghost" id="bPrev">←</button><button class="btn ghost" id="bNext">Suivant →</button></div>`;
 $('#main').innerHTML=head+`<div class="lvl" style="${dc}">${lvb}</div>`+body+bar+`<div class="note">${mode=='eleve'?'<b>Élève :</b> je regarde (ou j’appuie sur 🔊), je réponds, puis « Valider ». L’application dit ✓ ou ✗.':'<b>Au tableau :</b> on projette, on répond à l’oral puis la correction s’affiche.'}</div>`}
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-flip],[data-d]');if(!t)return;
 if(t.dataset.d!==undefined&&lv>0){const k=cur+'|'+lv+'|'+sr+'|',box=t.closest('.it'),i=[...document.querySelectorAll('.it')].indexOf(box),st=S[k+i]||(S[k+i]={segs:(items(cur,lv,sr)[i].draw.given||[]).map(s=>[...s])});if(st.done)return;const p=t.dataset.d.split(',').map(Number);
  if(!st.sel)st.sel=p;else if(st.sel[0]==p[0]&&st.sel[1]==p[1])st.sel=null;else{const s=[...st.sel,...p],j=st.segs.findIndex(x=>key2(x)==key2(s));if(j>=0)st.segs.splice(j,1);else st.segs.push(s);st.sel=null}render();return}
 if(t.dataset.undo!==undefined){const st=S[cur+'|'+lv+'|'+sr+'|'+t.dataset.undo];if(st&&st.segs){st.segs.pop();st.sel=null}render();return}
 if(t.dataset.say!==undefined){say(t.dataset.say);return}
 if(t.dataset.op!==undefined&&mode=='eleve'&&lv>0){const k=cur+'|'+lv+'|'+sr+'|'+t.dataset.i,st=S[k]||(S[k]={});if(st.done)return;st.pick=+t.dataset.op;render();return}
 if(t.dataset.val!==undefined){const i=t.dataset.val,k=cur+'|'+lv+'|'+sr+'|'+i,st=S[k],it=items(cur,lv,sr)[i];if(!st)return;if(it.draw){st.done=1;st.ok=norm(st.segs)==norm(it.draw.model)}else{if(st.pick===undefined)return;st.done=1;st.ok=st.pick===it.ans}render();return}
 if(t.dataset.flip){flip=!flip;render();return}
 if(t.dataset.card){card=(card+ +t.dataset.card+100)%6;flip=false;render();return}
 if(t.dataset.shuf){deckOrder={c:cur,o:shuf([0,1,2,3,4,5],Math.random)};card=0;flip=false;render();return}
 if(t.id=='vEx'){view='ex';render()}else if(t.id=='vCa'){view='ca';card=0;flip=false;render()}
 else if(t.dataset.f){flt=t.dataset.f;render()}
 else if(t.dataset.c){cur=t.dataset.c;lv=view=='ex'?-1:lv;shown=false;card=0;flip=false;deckOrder=null;render()}
 else if(t.dataset.e!==undefined){lv=+t.dataset.e;shown=false;render()}
 else if(t.dataset.s!==undefined){sr=+t.dataset.s;shown=false;render()}
 else if(t.dataset.m){mode=t.dataset.m;shown=false;render()}
 else if(t.dataset.fs){document.body.classList.toggle('focus')}
 else if(t.id=='bShow'){shown=!shown;render()}
 else if(t.id=='bNext'){if(lv<NL[cur])lv++;else{const i=ORDER.indexOf(cur);if(ORDER[i+1]){cur=ORDER[i+1];lv=-1}}shown=false;render()}
 else if(t.id=='bPrev'){if(lv>-1)lv--;shown=false;render()}});
const key2=s=>key(...s);
render();

</script></body></html>
